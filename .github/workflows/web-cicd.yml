name: Web Admin CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**' # Chỉ chạy khi có thay đổi trong thư mục web
  pull_request:
    branches: [ "main" ]
    paths:
      - 'web/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web # Trỏ vào thư mục chứa code React.js

    steps:
      # 1. Tải code từ GitHub về máy chủ ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      # 3. Cài đặt các thư viện (Dependencies)
      - name: Install dependencies
        run: npm ci

      # 4. Chạy kiểm tra lỗi cú pháp (Continuous Integration)
      - name: Run Linter
        run: npm run lint --if-present

      # 5. Build thử dự án để đảm bảo code không bị lỗi
      - name: Build Web App
        run: npm run build

      # --- PHẦN CD (Continuous Deployment) ---
      # Lưu ý: Thường Vercel sẽ tự động deploy khi bạn liên kết GitHub với Vercel.
      # Đoạn code dưới đây dùng để minh họa CD cho giảng viên thấy, nếu bạn cấu hình Vercel CLI.
